name: ci
on:
  pull_request: {}
  push:
    branches: [main, master]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (clone-verify)
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
